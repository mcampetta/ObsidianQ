[workspace]
members = [
    "crates/obsidianq-core",
    "crates/obsidianq-vault",
    "crates/obsidianq-cli",
    "crates/obsidianq-web",
    "crates/obsidianq-bench",
    "crates/obsidianq-fs",
]
resolver = "2"

[workspace.package]
version = "1.2.0"
edition = "2021"
authors = ["ObsidianQ Contributors"]
license = "MIT OR Apache-2.0"

# Shared dependency versions across workspace
[workspace.dependencies]
# Crypto primitives
# ML-KEM-768 via pqcrypto-kyber (Kyber768 ≡ ML-KEM-768, NIST FIPS 203)
# ml-kem crate 0.3.x is pre-release with broken dep chain as of Feb 2026
pqcrypto-kyber  = "0.8"
pqcrypto-traits = "0.3"
x25519-dalek    = { version = "2", features = ["static_secrets", "zeroize"] }
hkdf            = "0.12"
sha2            = "0.10"
argon2          = "0.5"
chacha20poly1305 = "0.10"
aes-gcm         = "0.10"
blake3          = "1"
rand            = { version = "0.8", features = ["getrandom"] }
rand_core       = "0.6"
zeroize         = { version = "1", features = ["derive"] }
subtle          = "2"

# Compression
zstd             = "0.13"

# Parallelism
rayon            = "1"

# Serialisation / IO
byteorder        = "1"
bytes            = "1"

# Error handling
thiserror        = "1"
anyhow           = "1"

# CLI
clap             = { version = "4", features = ["derive", "color"] }

# Async / Benchmarks (cli / bench only)
criterion        = { version = "0.5", features = ["html_reports"] }

# Hex / encoding
hex              = "0.4"
base64ct         = { version = "1", features = ["alloc"] }

# Logging
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Internal crates
obsidianq-core  = { path = "crates/obsidianq-core" }
obsidianq-vault = { path = "crates/obsidianq-vault" }
obsidianq-fs    = { path = "crates/obsidianq-fs" }

# Windows APIs (used by obsidianq-fs for WinFSP FFI + named events)
windows-sys      = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_Security",
] }

[profile.release]
opt-level    = 3
lto          = "thin"
codegen-units = 1
strip        = "symbols"

[profile.bench]
opt-level    = 3
lto          = "thin"
