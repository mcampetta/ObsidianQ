name: Web Decrypt Check

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/web-decrypt-check.yml"
      - "crates/obsidianq-core/**"
      - "crates/obsidianq-web/**"
      - "crates/obsidianq-cli/src/cmd/delivery.rs"
      - "web/**"
  pull_request:
    paths:
      - ".github/workflows/web-decrypt-check.yml"
      - "crates/obsidianq-core/**"
      - "crates/obsidianq-web/**"
      - "crates/obsidianq-cli/src/cmd/delivery.rs"
      - "web/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Check Rust crates
        run: |
          cargo check -p obsidianq-web
          cargo check -p obsidianq-web --target wasm32-unknown-unknown
          cargo test -p obsidianq-cli clean_meta_strips_utf8_bom -- --exact

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build
